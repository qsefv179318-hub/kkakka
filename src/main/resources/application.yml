spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kkacca
    username: kkacca_user
    password: kkacca1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update      # 엔티티 기반으로 테이블 자동 생성/갱신
      defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  sql:
    init:
      mode: always 

  data:
    mongodb:
      uri: mongodb://localhost:27017/kkacca
  cache:
    type: simple

openai:
  api-key: ${OPENAI_API_KEY}   # 터미널에서 export OPENAI_API_KEY=... 로 등록

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true       # HTTP 요청과 응답 모두 UTF-8 인코딩을 강제 적용합니다.
      enabled: true

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  shop-search-url: https://openapi.naver.com/v1/search/shop.json
